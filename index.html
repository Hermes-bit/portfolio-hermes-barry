<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <!-- Icône d'onglet : ma photo, recadrée sur le visage et découpée en rond -->
  <link rel="icon" href="assets/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-64.png?v=2" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- ?v= : numéro de version à changer à chaque mise en ligne. Sans lui, les navigateurs
       gardent l'ancienne copie des CSS et JS en mémoire et n'affichent pas les modifications. -->
  <link rel="stylesheet" href="css/style.css?v=20261112-17">
  <link rel="stylesheet" href="css/carte.css?v=20261112-17">
</head>
<body>

<header class="entete">
  <div class="wrap">
    <a class="nom" href="#accueil">Hermès Barry<small>Géomaticien</small></a>
    <nav class="menu" id="menu" aria-label="Navigation principale">
      <a href="#accueil" data-nav="accueil">Accueil</a>
      <a href="#projets" data-nav="projets">Projets</a>
      <a href="#parcours" data-nav="parcours">Parcours</a>
      <a href="#contact" data-nav="contact">Contact</a>
    </nav>
    <a class="cv-entete" id="cv-entete" href="assets/CV-Hermes-Barry.pdf" download>CV (PDF)</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>
</header>

<main id="app"></main>

<footer class="pied" id="pied"></footer>

<!-- Bouton « revenir en haut » : apparaît quand on a fait défiler la page (voir app.js) -->
<button class="haut" id="haut" type="button" aria-label="Revenir en haut de la page" title="Revenir en haut" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- Visionneuse : images et documents s'ouvrent ici, par-dessus le site assombri (voir app.js) -->
<dialog class="visionneuse" id="visionneuse" aria-label="Visionneuse">
  <button class="v-fermer" id="v-fermer" type="button" aria-label="Fermer" title="Fermer (Échap)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="v-nav v-prec" id="v-prec" type="button" aria-label="Image précédente" title="Précédente (←)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="v-nav v-suiv" id="v-suiv" type="button" aria-label="Image suivante" title="Suivante (→)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="v-scene" id="v-scene">
    <figure class="v-cadre">
      <div class="v-image" id="v-image"><img id="v-img" alt=""></div>
      <figcaption class="v-legende"><span id="v-compteur"></span><span id="v-texte"></span></figcaption>
      <div class="v-actions" id="v-actions"></div>
    </figure>
  </div>
</dialog>

<!-- Leaflet 1.9.4 (copie locale) -->
<script src="vendor/leaflet/leaflet.js"></script>
<!-- Fond de carte : régions, départements et contour de la France -->
<script src="js/fond-carte-france.js?v=20261112-17"></script>
<!-- Contour du Burkina Faso (carte de situation du projet GéoBurkina) -->
<script src="js/fond-carte-burkina.js?v=20261112-17"></script>
<!-- Contenu : profil, projets, compétences, lieux du parcours -->
<script src="js/donnees.js?v=20261112-17"></script>
<!-- Carte du parcours -->
<script src="js/carte.js?v=20261112-17"></script>
<!-- Pages et navigation -->
<script src="js/app.js?v=20261112-17"></script>
